<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Aurora accent glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#aurora)" stroke-width="3" opacity="0.4" filter="url(#glow)" />

  <!-- Inner precision grid marks -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Calculator Core Key Matrix Representation -->
  <g transform="translate(136, 126)">
    <!-- Display Window -->
    <rect x="0" y="0" width="240" height="60" rx="12" fill="#131d2e" stroke="rgba(56,189,248,0.3)" stroke-width="2" />
    <text x="220" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', monospace" font-size="28" font-weight="700" fill="#38bdf8" text-anchor="end">3.14159</text>

    <!-- Key Pad Grid 3x3 + equals -->
    <rect x="0" y="80" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="64" y="80" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="128" y="80" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="192" y="80" width="48" height="42" rx="8" fill="url(#aurora)" opacity="0.9" />

    <rect x="0" y="136" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="64" y="136" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="128" y="136" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="192" y="136" width="48" height="42" rx="8" fill="#0284c7" />

    <rect x="0" y="192" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="64" y="192" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="128" y="192" width="48" height="42" rx="8" fill="#1e293b" />
    <rect x="192" y="192" width="48" height="68" rx="8" fill="url(#aurora)" />

    <rect x="0" y="248" width="112" height="42" rx="8" fill="#1e293b" />
    <rect x="128" y="248" width="48" height="42" rx="8" fill="#1e293b" />

    <!-- Math symbol: radical / equals / plus -->
    <path d="M204 226 L228 226 M204 234 L228 234" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
